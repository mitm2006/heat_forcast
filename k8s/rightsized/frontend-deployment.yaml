apiVersion: apps/v1
kind: Deployment
metadata:
  name: climate-frontend
  namespace: climate-intelligence
  labels:
    app: climate-frontend
    tier: frontend
    optimized: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: climate-frontend
  template:
    metadata:
      labels:
        app: climate-frontend
        tier: frontend
        optimized: "true"
    spec:
      containers:
        - name: frontend
          image: climate-intelligence-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: climate-config
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 12
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 6
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
