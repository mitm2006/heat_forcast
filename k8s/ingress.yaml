apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: climate-ingress
  namespace: climate-intelligence
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: climate-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: climate-frontend-service
                port:
                  number: 5000
