# ============================================================
# k8s/hpa.yaml — Horizontal Pod Autoscaler
# Automatically scales right-sized pods when CPU exceeds 70%,
# guaranteeing zero performance degradation during traffic surges.
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: climate-api-hpa
  namespace: climate-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: climate-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
